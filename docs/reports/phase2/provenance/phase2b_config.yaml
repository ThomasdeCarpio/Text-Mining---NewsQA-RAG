embedding:
  provider: sentence-transformers
  model_name: all-MiniLM-L6-v2
  dimensions: 384
chunking:
  strategy: recursive
  chunk_size: 512
  chunk_overlap: 64
  sentences_per_chunk: 8
  sentence_overlap: 2
database:
  hnsw:
    space: cosine
    ef_construction: 200
    max_neighbors: 16
    ef_search: 50
llm:
  model: gemini-3.1-flash-lite
  temperature: 0.0
  max_tokens: 512
  reasoning_effort: minimal
retrieval:
  retriever: sparse
  top_k: 20
  sparse:
    method: bge-m3
    model: BAAI/bge-m3
    device: cuda
  reranker:
    enabled: true
    type: cross-encoder
    model: BAAI/bge-reranker-large
    top_n: 5
    batch_size: 8
    device: cuda
  hybrid:
    enabled: false
    dense_weight: 0.7
    sparse_weight: 0.3
artifacts:
  locked_index_dir: data/locked_index
evaluation:
  metrics:
  - faithfulness
  - answer_relevancy
  - context_precision
  - context_recall
  llm_model: gpt-4o-mini
metadata:
  categories:
  - Politics
  - Technology
  - Business
  - World
  - Science
  - Health
  - Sports
  - Entertainment
  - Other
