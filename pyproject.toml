[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "newsqa-rag"
version = "0.1.0"
description = "NewsQA retrieval-augmented question answering and evaluation"
readme = "README.md"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["common", "app/backend"]
include = ["newsqa_rag*", "newsqa_app*"]

[tool.pytest.ini_options]
pythonpath = ["common", "app/backend"]
testpaths = ["tests"]
