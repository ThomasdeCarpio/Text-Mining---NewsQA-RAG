# ============================================================
# NewsQA-RAG Configuration
# ============================================================
# This file controls all pipeline behavior: ingestion, indexing,
# retrieval, and evaluation. Scripts read this file via --config flag.

# --- Embedding Model ---
# Serves the legacy dense/Chroma route only. The locked retrieval path below
# uses BGE-M3 learned-sparse vectors and never touches this section.
# Phase 1 measured all-MiniLM-L6-v2 as the weakest of four dense embedders
# (MRR@5 0.482 vs 0.630 for intfloat/e5-base-v2 on resolved questions). It is
# kept only because the existing Chroma collection was built with it and a
# swap silently breaks it on a dimension mismatch. Rebuild the collection
# before changing these three lines together.
embedding:
  provider: "sentence-transformers"     # "openai" | "sentence-transformers"
  model_name: "all-MiniLM-L6-v2"       # OpenAI: "text-embedding-3-small", "text-embedding-3-large"
                                        # ST: "all-MiniLM-L6-v2", "all-mpnet-base-v2"
  dimensions: 384                       # Must match model output dim

# --- Chunking (LOCKED) ---
# Round 3 swept 256/32, 512/64 and 1024/128 and 512/64 won on both question
# variants (MRR@5 0.880 vs 0.875 and 0.822). Shorter splits the evidence span
# across chunks; longer dilutes it. Changing these invalidates every built index.
chunking:
  strategy: "recursive"       # "recursive" | "sentence" | "paragraph" | "hierarchical"
  chunk_size: 512             # Target chunk size in tokens
  chunk_overlap: 64           # Overlap between consecutive chunks
  # Hierarchical strategy only; children are indexed, parents are delivered.
  child_chunk_size: 256
  child_chunk_overlap: 32

# --- Database (ChromaDB) ---
database:
  hnsw:
    space: "cosine"
    ef_construction: 200
    max_neighbors: 16
    ef_search: 50

# --- LLM ---
llm:
  model: "gpt-4o-mini"
  temperature: 0.0
  max_tokens: 1024

# --- Retrieval (LOCKED by the Phase 1 tournament) ---
# Full evidence and the rejected alternatives: notebooks/13_phase_1_tournament_report.ipynb
# Measured on 281 resolved questions from the 50 seeded development articles:
#   hit_rate@5 0.957   MRR@5 0.880   nDCG@5 0.898   p50 513 ms
retrieval:
  retriever: "sparse"        # "dense" | "sparse" | "bm25" | "hybrid"
                             # Sparse beat the best dense embedder 0.806 vs 0.630
                             # MRR@5 before reranking and stayed ahead after.
  top_k: 20                  # Candidates handed to the reranker
  sparse:
    method: "bge-m3"          # "bm25" | "bge-m3"
    model: "BAAI/bge-m3"
    device: null              # null -> CUDA when present, else CPU
  reranker:
    enabled: true
    type: "cross-encoder"     # "noop" | "cross-encoder" -- the key get_reranker reads.
                              # This was "provider: cohere", which get_reranker
                              # ignores, so the app was silently running noop.
    model: "BAAI/bge-reranker-large"
    top_n: 5                  # Results kept after reranking
    batch_size: 8             # bge-reranker-large is a large model; keep this small
  hybrid:
    enabled: false            # Fusing the weak dense ranking in LOST to sparse
    dense_weight: 0.7         # alone in round 2 (0.799 vs 0.880 MRR@5).
    sparse_weight: 0.3

# --- Locked retrieval artifacts ---
# Built once by notebooks/14_export_locked_index_kaggle.ipynb and unpacked here.
# Override with the RAG_LOCKED_INDEX_DIR environment variable.
artifacts:
  locked_index_dir: "data/locked_index"

# --- Evaluation (Ragas) ---
evaluation:
  metrics:
    - "faithfulness"
    - "answer_relevancy"
    - "context_precision"
    - "context_recall"
  llm_model: "gpt-4o-mini"   # LLM used by Ragas for evaluation

# --- Metadata ---
metadata:
  categories:                 # Controlled vocabulary for article categories
    - "Politics"
    - "Technology"
    - "Business"
    - "World"
    - "Science"
    - "Health"
    - "Sports"
    - "Entertainment"
    - "Other"
