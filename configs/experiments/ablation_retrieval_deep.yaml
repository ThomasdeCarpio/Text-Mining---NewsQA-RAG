schema_version: 1

experiment:
  id: ablation-retrieval-deep
  name: Deep Retrieval & Cutoff Sensitivity Analysis
  description: Comprehensive evaluation of Top-K, Top-N cutoffs, Retrieval methods, and Rerankers on NewsQA.

output_dir: outputs/experiments
seed: 42

dataset:
  article_field: article_key
  development_articles: 50
  indexes:
    baseline:
      config: configs/config.yaml
      variant_manifest: evaluation/manifests/newsqa_200_11064.deduplicated.variant.json
      testsets:
        original: data/evaluation/newsqa_200_11064/final_deduplicated/testset_reviewed_original.jsonl
        resolved: data/evaluation/newsqa_200_11064/final_deduplicated/testset_resolved.jsonl

fixed:
  index: baseline
  partition: all
  variant: original
  retrieval_only: true

matrix:
  retriever: [bm25, dense, hybrid]
  reranker: [noop, cross-encoder]
  top_k: [5, 10, 20]
  rerank_top_n: [3, 5]

runtime:
  max_attempts: 2
  progress: true

judge:
  enabled: false

summary:
  metrics:
    - retrieval.hit_rate@1
    - retrieval.hit_rate@3
    - retrieval.hit_rate@5
    - retrieval.hit_rate@10
    - retrieval.mrr@5
    - retrieval.ndcg@5
    - retrieval.recall@5
    - retrieval.recall@10
  paired_metric: retrieval.mrr@5
  quality_metric: retrieval.mrr@5.mean
  latency_metric: latency.total.p95_ms
