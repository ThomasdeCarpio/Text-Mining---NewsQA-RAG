schema_version: 1

experiment:
  id: ablation-3-reranking
  name: Reranker Model and Impact Ablation
  description: Compare no-op baseline vs Cross-Encoder MiniLM reranker on Hybrid retrieval.

output_dir: outputs/experiments
seed: 42

dataset:
  article_field: article_key
  development_articles: 50
  indexes:
    baseline:
      config: configs/config.yaml
      variant_manifest: evaluation/manifests/newsqa_200_11064.deduplicated.variant.json
      testsets:
        original: data/evaluation/newsqa_200_11064/final_deduplicated/testset_reviewed_original.jsonl
        resolved: data/evaluation/newsqa_200_11064/final_deduplicated/testset_resolved.jsonl

fixed:
  index: baseline
  partition: all
  variant: original
  retriever: hybrid
  retrieval_only: true
  top_k: 10
  rerank_top_n: 5

matrix:
  reranker: [noop, cross-encoder]
  reranker_model: [cross-encoder/ms-marco-MiniLM-L-6-v2]

runtime:
  max_attempts: 2
  progress: true

judge:
  enabled: false

summary:
  metrics: [retrieval.hit_rate@5, retrieval.mrr@5, retrieval.ndcg@5, retrieval.recall@5]
  paired_metric: retrieval.mrr@5
  quality_metric: retrieval.mrr@5.mean
  latency_metric: latency.total.p95_ms
